name: GCC:16
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-gcc:
    name: Build and Test (module ${{ matrix.module }})
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    strategy:
      fail-fast: false
      matrix:
        module: [OFF, ON]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: apt-get update && apt-get install -y ninja-build

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Configure with CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_DEMO=${{ matrix.module }} -DVENUS_BUILD_MODULE=${{ matrix.module }}

      - name: Build
        run: cmake --build build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
