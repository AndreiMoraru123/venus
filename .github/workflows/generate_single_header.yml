name: "Generate Single Header"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run:
    name: Generate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup LLVM 22
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: "22"

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Create build directory
        run: mkdir -p build

      - name: Configure with CMake
        working-directory: build
        run: cmake .. -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_DEMO=OFF -DBUILD_SINGLE_HEADER=ON -DVENUS_BUILD_MODULE=OFF

      - name: Build
        working-directory: build
        run: cmake --build . -j$(nproc)

      - name: Run
        working-directory: ${{github.workspace}}/build
        run: |
          ./scripts/make_single_header include/venus.hpp ${{github.workspace}}/single_include/venus.hpp ${{github.workspace}}/core

      - name: Upload
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Update single header with latest code
          file_pattern: single_include/*
          commit_user_name: GitHub Actions Bot
          commit_user_email: action@github.com
