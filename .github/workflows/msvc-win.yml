name: MSVC Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-msvc:
    name: Build and Test (module ${{ matrix.module }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: [OFF, ON]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "latest"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DVENUS_BUILD_MODULE=${{ matrix.module }}

      - name: Build
        run: cmake --build build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
